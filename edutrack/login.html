<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>EduTrack — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth"><a class="logo" href="index.html">EDU TRACK</a>
    <form class="card" id="f" onsubmit="return liSubmit(event)">
      <h2>Login</h2>
      <div class="grid">
        <div>
          <div class="lbl">Email</div><input name="email" type="email" value="">
        </div>
        <div>
          <div class="lbl">Password</div><input name="password" type="password" value="">
        </div>
      </div>
      <p class="err" id="e"></p><button class="btn p">Login</button>
      <p class="note">New here? <a href="signup.html">Sign up</a></p>
    </form>
  </div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>window.PAGE='login'; route();</script>
</body>
</html>
